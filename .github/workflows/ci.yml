name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.23.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run Test Suite
        run: pnpm test

      - name: Build All Packages & Apps
        run: pnpm -r build

      - name: Validate Fixtures with CLI CI Command
        run: |
          node apps/cli/dist/index.js ci --dir fixtures/simple-prompt
          node apps/cli/dist/index.js ci --dir fixtures/chat-prompt
          node apps/cli/dist/index.js ci --dir fixtures/variable-prompt
