name: strict-json-agent
version: 1.0.0
description: Agent that must output strictly valid JSON
template: "You must output valid json: {{input}}"
variables:
  input:
    type: string
    required: true
tests:
  - name: Valid Json Check
    inputs:
      input: "Generate user record"
    expectedProperties:
      jsonValid: true
      requiredFields: ["username", "email"]
